[project]
name = "ai-pes"
version = "0.2.0"
requires-python = ">=3.12"
# Intentionally empty: the skill runs on the Python standard library alone. Nothing here, and
# nothing in wikipedia-interest/, may add a runtime dependency — evals/test_cli_golden.py enforces
# it by running the CLI under `python3 -I -S`.
dependencies = []

[dependency-groups]
# Dev-only tools for the offline evaluation suite (evals/). Not part of the shipped skill.
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-q"
