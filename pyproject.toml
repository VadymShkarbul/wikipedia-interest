[project]
name = "ai-pes"
version = "0.2.0"
requires-python = ">=3.12"
# Intentionally empty: the skill runs on the Python standard library alone. Nothing here, and
# nothing in wikipedia-interest/scripts/, may add a runtime dependency — the evals enforce
# it by running the CLI under `python3 -I -S`.
dependencies = []

[dependency-groups]
# Dev-only tools for the offline eval suite (wikipedia-interest/evals/). The suite ships inside
# the skill folder but is never loaded at runtime; the skill itself needs nothing.
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["wikipedia-interest/evals"]
addopts = "-q"
