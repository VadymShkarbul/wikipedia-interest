[project]
name = "ai-pes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[dependency-groups]
# Dev-only tools for the offline evaluation suite (evals/). Not part of the shipped skill.
dev = [
    "pytest>=8.0",
    "pypdf>=4.0",
    "mcp>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-q"
